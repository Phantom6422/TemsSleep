name: TemsSleep
api-version: '1.21'
version: ${project.version}
main: me.mrgeneralq.sleepmost.core.Sleepmost
description: One-player sleep, night skip animations and sleep utilities.
authors: [MrGeneralQ, LesleyXYZ, HorrendousEntity, dubsector]
website: https://github.com/Phantom6422/TemsSleep
commands:
  temssleep:
    usage: /temssleep
    description: open the TemsSleep help menu
    aliases: [ts, sleepmost, sm]
softdepend: [PlaceholderAPI, GSit, SuperVanish, PremiumVanish, Essentials]
permissions:
  temssleep.*:
    description: Grants every TemsSleep command permission.
    default: op
    children:
      temssleep.help: true
      temssleep.reload: true
      temssleep.enable: true
      temssleep.disable: true
      temssleep.setflag: true
      temssleep.info: true
      temssleep.version: true
      temssleep.reset: true
      temssleep.setops: true
      temssleep.bed: true
      temssleep.sleep: true
      temssleep.kick: true
      temssleep.insomnia: true
      temssleep.getflag: true
      temssleep.resetflag: true
      temssleep.debug: true
      temssleep.notify: true
      temssleep.alerts.update: true
  temssleep.help:
    description: Allows viewing the TemsSleep help menu.
    default: op
  temssleep.reload:
    description: Allows reloading the TemsSleep configuration.
    default: op
  temssleep.enable:
    description: Allows enabling TemsSleep for a world.
    default: op
  temssleep.disable:
    description: Allows disabling TemsSleep for a world.
    default: op
  temssleep.setflag:
    description: Allows changing TemsSleep flags.
    default: op
  temssleep.info:
    description: Allows viewing the flags of a world.
    default: op
  temssleep.version:
    description: Allows viewing the TemsSleep version.
    default: op
  temssleep.reset:
    description: Allows resetting all flags of a world.
    default: op
  temssleep.setops:
    description: Allows enabling one-player-sleep for a world.
    default: op
  temssleep.bed:
    description: Allows teleporting to your bed spawn.
    default: op
  temssleep.sleep:
    description: Allows using /temssleep sleep.
    default: op
  temssleep.kick:
    description: Allows kicking a sleeping player out of their bed.
    default: op
  temssleep.insomnia:
    description: Allows enabling insomnia for a world.
    default: op
  temssleep.getflag:
    description: Allows reading a single flag value.
    default: op
  temssleep.resetflag:
    description: Allows resetting a single flag value.
    default: op
  temssleep.debug:
    description: Allows toggling TemsSleep debug output.
    default: op
  temssleep.notify:
    description: Allows receiving world-disabled notifications.
    default: op
  temssleep.alerts.update:
    description: Allows receiving update notifications.
    default: op
  temssleep.exempt:
    description: Exempts a player from the sleep count.
    default: false
  sleepmost.*:
    description: Legacy alias for temssleep.*
    default: op
    children:
      temssleep.*: true
  sleepmost.exempt:
    description: Legacy alias for temssleep.exempt
    default: false
