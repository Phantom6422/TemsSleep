# WELCOME TO TEMSSLEEP
# BASED ON SLEEP-MOST BY MRGENERALQ AND CONTRIBUTORS
# VERSION: 5.9.6
# SUPPORT AND DOCS: https://github.com/Phantom6422/TemsSleep
# RELEASES: https://github.com/Phantom6422/TemsSleep/releases
#
# WARNING: This fork is heavily modified using AI / "vibe coding" methods.
# Review the diff and test on a staging server before production use.
# Keep a rollback jar available.


# WARNING: SUPPORT IS ONLY GIVEN TO THE LATEST VERSION
# The update checker reads the latest GitHub release tag (e.g. v5.9.0).
# The repository must be PUBLIC: private repositories cannot be read by the
# plugin without credentials. Set this to owner/repo for your public repo.
update-checker-enabled: true
update-checker-github-repository: "Phantom6422/TemsSleep"

# specify the speed/ticks for the animation
# DEFAULT: 85 (recommended)
nightcycle-animation-speed: 85
nightcycle-animation-speed-max: 170


# AFK handling controls which placeholder is used to determine if a player is afk
# This requires PlaceholderAPI to be installed and the use-afk flag to be enabled
afk-handling:
  placeholder: "%essentials_afk%"
  positive-result: "yes"

sleep:
  # for each world, you can create different configurations
  world:
    enabled: true
    calculation-method: percentage
    percentage-required: 0.5
    players-required: 5
    mob-no-target: true
    use-exempt: false
    use-afk: false
    use-bossbar: false
    use-sound-night-skipped: false
    use-sound-storm-skipped: false
    use-title-night-skipped: false
    use-title-storm-skipped: false
    exempt-creative: false
    exempt-spectator: false
    prevent-sleep: false
    prevent-phantom: false
    nightcycle-animation: false
    storm-sleep: true
    skip-delay: 0
    heal: false
    feed: false
    skip-night-sound: ui.toast.challenge_complete
    skip-storm-sound: entity.wither.spawn
    reset-time-since-rest: true

  world2:
    enabled: false
    calculation-method: percentage
    percentage-required: 0.5
    players-required: 5
    mob-no-target: true
    use-exempt: false
    use-afk: false
    use-bossbar: false
    use-sound-night-skipped: false
    use-sound-storm-skipped: false
    use-title-night-skipped: false
    use-title-storm-skipped: false
    exempt-creative: false
    exempt-spectator: false
    prevent-sleep: false
    prevent-phantom: false
    nightcycle-animation: false
    storm-sleep: true
    skip-delay: 0
    heal: false
    feed: false
    skip-night-sound: ui.toast.challenge_complete
    skip-storm-sound: entity.wither.spawn
    reset-time-since-rest: true

# specify the time which the world will be set after reset
time-after-reset: 0

# Configure when players can start sleeping.
# The night animation itself always runs until dawn (6:00 AM), even when
# night-end is earlier.
time:
  night-start: 12542
  night-end: 23850

messages:
  cooldown: 10

#debug mode
debug-mode: false